# Check the page, give every pull request a preview link, and republish the lab site after a
# push to main. The work is done by the shared workflow in OMEGA-HKUSTGZ/.github; the lab site
# lists this page in its project-pages.json.
name: Project page

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  page:
    uses: OMEGA-HKUSTGZ/.github/.github/workflows/project-page.yml@main
    with:
      slug: unit
    secrets: inherit
