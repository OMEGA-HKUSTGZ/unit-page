# Republish https://omega-hkustgz.github.io/projects/unit/ after a push to main.
# The shared workflow lives in OMEGA-HKUSTGZ/.github; the lab site lists this page
# in its project-pages.json.
name: Publish on the lab site

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
      - name: Verify published point-cloud bytes and Range support
        run: node tools/verify-point-cloud-host.mjs
  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: OMEGA-HKUSTGZ/.github/.github/workflows/notify-lab-site.yml@main
    secrets: inherit
